      <div [formGroup]="form" class="fade-in">
        <h3 class="section-title">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
          Parent / Guardian Details
        </h3>

        <div class="form-row">
          <div class="form-group flex-2">
            <label>Name of Parent/Guardian (As per Passport) <span class="required">*</span></label>
            <div class="inline-fields">
              <input type="text" placeholder="Given Name" formControlName="parentName" [class.invalid]="form.get('parentName')?.invalid && form.get('parentName')?.touched">
              <input type="text" placeholder="Surname" formControlName="parentSurname">
            </div>
          </div>
          <div class="form-group">
            <label>Relationship</label>
            <select formControlName="relationship">
              <option *ngFor="let rel of relationships" [value]="rel.name">{{rel.name}}</option>
            </select>
          </div>
          <div class="form-group">
            <label>Nationality</label>
            <select formControlName="parentNationality">
              <option *ngFor="let nat of nationalities" [value]="nat.name">{{nat.name}}</option>
            </select>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>Passport Number <span class="required">*</span></label>
            <input type="text" placeholder="Passport No." formControlName="parentPassportNo" [class.invalid]="form.get('parentPassportNo')?.invalid && form.get('parentPassportNo')?.touched">
          </div>
          <div class="form-group">
            <label>Civil ID <span class="required">*</span></label>
            <input type="text" placeholder="Civil ID" formControlName="civilNo" [class.invalid]="form.get('civilNo')?.invalid && form.get('civilNo')?.touched">
          </div>
          <div class="form-group">
            <label>Employer <span class="required">*</span></label>
            <input type="text" placeholder="Employer Name" formControlName="employer" [class.invalid]="form.get('employer')?.invalid && form.get('employer')?.touched">
          </div>
          <div class="form-group">
            <label>Occupation <span class="required">*</span></label>
            <input type="text" placeholder="Job Title" formControlName="occupation" [class.invalid]="form.get('occupation')?.invalid && form.get('occupation')?.touched">
          </div>
        </div>
      </div>
